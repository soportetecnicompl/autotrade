[telegram]
; Créalos en https://my.telegram.org -> API development tools
api_id = 12345678
api_hash = tu_api_hash
phone = +504XXXXXXXX
; @usuario del canal, enlace de invitación, o ID numérico (ver: python main.py --list-dialogs)
; Tu cuenta debe ser miembro del canal.
channel = @mi_canal_de_senales
session_name = autotrade

[mt5]
; Si login queda vacío se usa la cuenta que esté abierta en el terminal MT5.
login =
password =
server =
; Ruta a terminal64.exe (opcional)
path =
; Nombre EXACTO del símbolo en tu broker (XAUUSD, XAUUSDm, XAUUSD.a, GOLD...)
symbol = XAUUSD
magic = 20260101
; Slippage máximo permitido en puntos
deviation = 30

[trading]
; true = solo simula y escribe en el log lo que haría. Pruébalo así primero.
dry_run = true
; Lote TOTAL por señal, repartido entre sus órdenes (una por TP).
; Ej: 0.02 con 2 TPs -> 2 órdenes de 0.01. Si no alcanza el lote mínimo
; del broker, se abren menos órdenes.
lot_size = 0.02
; Si > 0, ignora lot_size: lote total calculado para arriesgar este % de la equity (hasta el SL)
risk_percent = 0
; Máximo de TPs (= órdenes) por señal
max_tps = 2
; Tope de posiciones + pendientes abiertas del bot
max_open_positions = 6
; Si el precio actual está a esta distancia (USD) de la entrada, entra a mercado
market_tolerance = 1.5
; Entradas pendientes más lejos que esto (USD) se descartan
max_pending_distance = 30
; Minutos de vida de las órdenes pendientes (0 = sin vencimiento)
pending_expiry_min = 60
; Señales más viejas que esto (segundos) se ignoran
max_signal_age_sec = 60
; Operar señales sin TP
allow_no_tp = false
; Obedecer mensajes tipo "mover a BE", "cerrar todo", "cerrar mitad", "SL a 2650"
enable_commands = true
; Break-even con colchón (USD a favor)
be_offset = 0.0
; Si MT5 responde "requote / precio cambiado" en una orden a mercado, reintenta con el
; precio actual hasta este número de veces (0 = no reintentar)
requote_retries = 3
retry_delay_ms = 200
; Al ABRIR, si el precio empeora más de esto (USD) respecto al de la señal, se cancela
retry_max_slippage = 1.0
; Distancia mínima SL/TP que exige el broker (stops level):
;   skip   = si la señal no cumple, no se opera y se avisa (recomendado)
;   adjust = aleja el SL/TP hasta el mínimo y avisa (cambia el riesgo/objetivo de la señal)
stops_policy = skip

[filters]
; Solo se operan señales NUEVAS enviadas dentro de este horario (la hora es la
; del mensaje en Telegram). Los comandos del canal (BE, close all...) siempre se obedecen.
; Vacío = sin restricción. Pruébalo antes con: python backtest.py run ... --trading-hours "..."
; Ejemplos:  trading_days = Mon-Fri   |   trading_hours = 08:00-12:00, 14:00-18:00
trading_days =
trading_hours =
; Zona horaria en la que escribes los días/horas (Honduras = -6, sin horario de verano)
tz_offset_hours = -6

[alerts]
; Avisos por Telegram a tu propio chat (Mensajes guardados): arranque, reinicios tras
; caídas, señales operadas o ignoradas, errores de órdenes y caídas de MT5.
enabled = true
; "me" = tus Mensajes guardados; o un @usuario / ID numérico
target = me
; Avisar de cada señal operada y de cada comando del canal (BE, close all...)
notify_signals = true
; Avisar de señales ignoradas (fuera de horario, SL inválido, límite de posiciones...)
notify_skips = true
; Cada cuántos segundos revisar que MT5 siga conectado y con Algo Trading activo
mt5_check_seconds = 30
; OPCIONAL: URL de un servicio de "latido" (p. ej. healthchecks.io). El bot hace ping cada
; heartbeat_minutes SOLO si Telegram y MT5 están bien. Si el equipo se apaga o pierde
; internet, el servicio te avisa por su cuenta (el bot no puede avisar si está apagado).
heartbeat_url =
heartbeat_minutes = 5
