[telegram]
; Créalos en https://my.telegram.org -> API development tools
api_id = 12345678
api_hash = tu_api_hash
phone = +504XXXXXXXX
; @usuario del canal, enlace de invitación, o ID numérico (ver: python main.py --list-dialogs)
; Tu cuenta debe ser miembro del canal.
channel = @mi_canal_de_senales
session_name = autotrade

[mt5]
; Si login queda vacío se usa la cuenta que esté abierta en el terminal MT5.
login =
password =
server =
; Ruta a terminal64.exe (opcional)
path =
; Nombre EXACTO del símbolo en tu broker (XAUUSD, XAUUSDm, XAUUSD.a, GOLD...)
symbol = XAUUSD
magic = 20260101
; Slippage máximo permitido en puntos
deviation = 30

[trading]
; true = solo simula y escribe en el log lo que haría. Pruébalo así primero.
dry_run = true
; Lote TOTAL por señal, repartido entre sus órdenes (una por TP).
; Ej: 0.02 con 2 TPs -> 2 órdenes de 0.01. Si no alcanza el lote mínimo
; del broker, se abren menos órdenes.
lot_size = 0.02
; Si > 0, ignora lot_size: lote total calculado para arriesgar este % de la equity (hasta el SL)
risk_percent = 0
; Máximo de TPs (= órdenes) por señal
max_tps = 2
; Tope de posiciones + pendientes abiertas del bot
max_open_positions = 6
; Si el precio actual está a esta distancia (USD) de la entrada, entra a mercado
market_tolerance = 1.5
; Entradas pendientes más lejos que esto (USD) se descartan
max_pending_distance = 30
; Minutos de vida de las órdenes pendientes (0 = sin vencimiento)
pending_expiry_min = 60
; Señales más viejas que esto (segundos) se ignoran
max_signal_age_sec = 60
; Operar señales sin TP
allow_no_tp = false
; Obedecer mensajes tipo "mover a BE", "cerrar todo", "cerrar mitad", "SL a 2650"
enable_commands = true
; Break-even con colchón (USD a favor)
be_offset = 0.0
